<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do List Life Dashboard</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/app.js" defer></script>
  </head>
  <body>

    <!-- Storage unavailability warning banner -->
    <div id="storage-warning" role="alert" aria-live="polite" hidden>
      Local Storage is unavailable. Your data will not be saved between sessions.
    </div>

    <!-- ========== HEADER ========== -->
    <header>
      <h1>Life Dashboard</h1>
      <button
        id="theme-toggle"
        type="button"
        aria-pressed="false"
        aria-label="Toggle dark theme"
      >
        🌙 Dark Mode
      </button>
    </header>

    <!-- ========== MAIN CONTENT ========== -->
    <main>

      <!-- ---- Greeting Panel ---- -->
      <section id="panel-greeting" aria-labelledby="greeting-heading">
        <h2 id="greeting-heading">Greeting</h2>

        <p id="greeting-time" aria-label="Current time">00:00</p>
        <p id="greeting-date" aria-label="Current date"></p>
        <p id="greeting-text" aria-label="Greeting message">Good Morning, Friend</p>

        <div class="name-input-group">
          <label for="greeting-name-input">Your name</label>
          <input
            type="text"
            id="greeting-name-input"
            placeholder="Enter your name"
            aria-label="Enter your name"
            maxlength="50"
          />
        </div>
      </section>

      <!-- ---- Focus Timer Panel ---- -->
      <section id="panel-timer" aria-labelledby="timer-heading">
        <h2 id="timer-heading">Focus Timer</h2>

        <p id="timer-display" aria-label="Timer countdown" aria-live="polite">25:00</p>

        <div class="timer-controls" role="group" aria-label="Timer controls">
          <button
            id="timer-start"
            type="button"
            aria-disabled="false"
            aria-label="Start timer"
          >
            Start
          </button>
          <button
            id="timer-stop"
            type="button"
            aria-disabled="true"
            aria-label="Stop timer"
          >
            Stop
          </button>
          <button
            id="timer-reset"
            type="button"
            aria-label="Reset timer"
          >
            Reset
          </button>
        </div>

        <div class="timer-duration-group">
          <label for="timer-duration-input">Duration (minutes)</label>
          <input
            type="number"
            id="timer-duration-input"
            min="1"
            max="120"
            value="25"
            aria-label="Timer duration in minutes"
            aria-describedby="timer-duration-error"
          />
          <span id="timer-duration-error" role="alert" aria-live="polite"></span>
        </div>

        <div id="timer-alert" role="alert" aria-live="assertive" hidden>
          Time is up! Take a break.
        </div>
      </section>

      <!-- ---- Task Manager Panel ---- -->
      <section id="panel-tasks" aria-labelledby="tasks-heading">
        <h2 id="tasks-heading">Task Manager</h2>

        <form id="task-form" aria-label="Add new task" novalidate>
          <label for="task-input">New task</label>
          <input
            type="text"
            id="task-input"
            placeholder="Enter task title"
            aria-label="New task title"
            aria-describedby="task-input-error"
            autocomplete="off"
          />
          <button type="submit" aria-label="Add task">Add Task</button>
          <span id="task-input-error" role="alert" aria-live="polite"></span>
        </form>

        <div class="task-sort-group">
          <label for="task-sort">Sort by</label>
          <select id="task-sort" aria-label="Sort tasks by">
            <option value="creation">Creation order</option>
            <option value="alpha">Alphabetically (A–Z)</option>
            <option value="completed-last">Completed last</option>
          </select>
        </div>

        <ul id="task-list" aria-label="Task list" aria-live="polite"></ul>
      </section>

      <!-- ---- Quick Links Panel ---- -->
      <section id="panel-links" aria-labelledby="links-heading">
        <h2 id="links-heading">Quick Links</h2>

        <form id="link-form" aria-label="Add new quick link" novalidate>
          <div class="link-form-fields">
            <label for="link-label-input">Label</label>
            <input
              type="text"
              id="link-label-input"
              placeholder="e.g. Google"
              aria-label="Link label"
              aria-describedby="link-input-error"
              autocomplete="off"
            />

            <label for="link-url-input">URL</label>
            <input
              type="url"
              id="link-url-input"
              placeholder="https://example.com"
              aria-label="Link URL"
              aria-describedby="link-input-error"
              autocomplete="off"
            />
          </div>
          <button type="submit" aria-label="Add link">Add Link</button>
          <span id="link-input-error" role="alert" aria-live="polite"></span>
        </form>

        <div id="links-container" aria-label="Quick links" aria-live="polite"></div>
      </section>

    </main>

  </body>
</html>
